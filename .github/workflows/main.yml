name: Build VCMP Kotlin/Java Plugin

on:
  push:
    branches:
      - main
  workflow_dispatch:

jobs:
  build:
    runs-on: ubuntu-latest

    steps:
      - name: Checkout this repo (not needed if you clone inside)
        uses: actions/checkout@v3

      - name: Install dependencies
        run: sudo apt-get update && sudo apt-get install -y wget unzip

      - name: Clone vcmp-java-demo
        run: |
          git clone https://github.com/theKAKAN/vcmp-java-demo.git
          cd vcmp-java-demo
          chmod +x ./gradlew

      - name: Install OpenLogic JDK 8
        run: |
          wget https://builds.openlogic.com/downloadJDK/openlogic-openjdk/8u462-b08/openlogic-openjdk-8u462-b08-linux-x64-deb.deb -O jdk.deb
          sudo dpkg -i jdk.deb
          sudo apt-get install -f -y
          java -version

      - name: Build shadow JAR
        run: |
          cd vcmp-java-demo
          ./gradlew shadowJar

      - name: Upload JAR artifact
        uses: actions/upload-artifact@v3
        with:
          name: vcmp-plugin-jar
          path: vcmp-java-demo/build/libs/*.jar
