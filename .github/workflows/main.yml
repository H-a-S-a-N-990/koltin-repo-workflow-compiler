name: Build VCMP Java Demo (External Repo)

on:
  workflow_dispatch:

jobs:
  build:
    runs-on: ubuntu-latest

    steps:
    - name: Clone VCMP Java Demo repository
      run: |
        git clone https://github.com/theKAKAN/vcmp-java-demo.git
        cd vcmp-java-demo
        echo "Repository cloned successfully."

    - name: Set up Java 8 (JDK 8)
      uses: actions/setup-java@v4
      with:
        distribution: 'temurin'
        java-version: '8'

    - name: Verify Java versions
      run: |
        echo "Checking Java runtime and compiler versions..."
        java -version
        javac -version

    # 🧩 Fix Gradle repositories: keep v04.thijn.ovh but add Maven Central
    - name: Patch Gradle repositories
      working-directory: vcmp-java-demo
      run: |
        echo "Ensuring Gradle has both v04.thijn.ovh and Maven Central..."
        if ! grep -q "repo1.maven.org" build.gradle; then
          sed -i '/repositories {/a\\t\tmavenCentral()' build.gradle
        fi
        echo "Repositories in use:"
        grep -A5 "repositories" build.gradle || true

    - name: Build using Gradle wrapper
      working-directory: vcmp-java-demo
      run: |
        chmod +x gradlew
        ./gradlew shadowJar --no-daemon --stacktrace

    - name: Upload built JAR as artifact
      uses: actions/upload-artifact@v4
      with:
        name: vcmp-java-demo-jar
        path: vcmp-java-demo/build/libs/*.jar
