name: Find Email From Old Commits

on:
  workflow_dispatch:

jobs:
  find-email:
    runs-on: ubuntu-latest
    steps:
      - name: Checkout target repo
        uses: actions/checkout@v4
        with:
          repository: Hasan2arabic/Hasan2arabic.github.io   # ⬅️ replace this

      - name: Extract commit emails
        run: |
          echo "Collecting commit emails..."
          git log --format='%ae' | sort | uniq -c | sort -nr > emails.txt
          echo "Most used email(s):"
          cat emails.txt
